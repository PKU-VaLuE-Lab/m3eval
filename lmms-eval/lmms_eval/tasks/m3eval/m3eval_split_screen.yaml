task: "m3eval_split_screen"
include: _generation_kwargs_yaml
dataset_path: json
dataset_kwargs:
  data_files:
    test: data/m3eval/qa_root/split_screen/split_screen_qa.json
test_split: test
output_type: generate_until

doc_to_visual: !function m3eval_utils.public_doc_to_visual
doc_to_text: !function m3eval_utils.public_doc_to_text
doc_to_target: "answer"

process_results: !function m3eval_utils.m3eval_split_screen_process_results
metric_list:
  - metric: m3eval_divided_attention_accuracy
    aggregation: mean
    higher_is_better: true
  - metric: m3eval_divided_attention_spatial_source_grounding_accuracy
    aggregation: mean
    higher_is_better: true
  - metric: m3eval_divided_attention_no_swap_source_identification_accuracy
    aggregation: mean
    higher_is_better: true
  - metric: m3eval_divided_attention_no_swap_order_understanding_accuracy
    aggregation: mean
    higher_is_better: true
  - metric: m3eval_divided_attention_no_swap_content_retention_accuracy
    aggregation: mean
    higher_is_better: true
  - metric: m3eval_divided_attention_swap_source_identification_accuracy
    aggregation: mean
    higher_is_better: true
  - metric: m3eval_divided_attention_swap_order_understanding_accuracy
    aggregation: mean
    higher_is_better: true
  - metric: m3eval_divided_attention_swap_content_retention_accuracy
    aggregation: mean
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nGiven the question above with the provided choices, provide your answer directly without extra explanation.\nYour final line must be exactly:\nThe final answer is X\nX must be one uppercase option letter.\n"

metadata:
  version: 1.0
  total_frames: 96
