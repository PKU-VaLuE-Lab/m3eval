[tool.black]
line-length = 240

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmms_eval"
version = "0.6.1"
authors = [{ name = "LMMMs-Lab Evaluation Team", email = "lmms-lab@outlook.com" }]
description = "lmms-eval subset for M3Eval InternVL3.5-8B evaluation"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.12.0",
    "datasets==4.5.0",
    "decord==0.6.0",
    "einops==0.8.2",
    "evaluate==0.4.6",
    "huggingface-hub==0.36.2",
    "Jinja2==3.1.6",
    "jsonlines==4.0.0",
    "loguru==0.7.3",
    "numpy==2.2.6",
    "packaging==26.0",
    "pandas==2.3.3",
    "pillow==12.1.1",
    "protobuf==6.33.5",
    "pytablewriter==1.2.1",
    "pytz==2025.2",
    "PyYAML==6.0.3",
    "sacrebleu==2.6.0",
    "safetensors==0.7.0",
    "scikit-learn==1.7.2",
    "sentencepiece==0.2.1",
    "tenacity==9.1.4",
    "timm==1.0.24",
    "tokenizers==0.22.2",
    "torch==2.10.0+cu129",
    "torchvision==0.25.0+cu129",
    "tqdm==4.67.3",
    "transformers==4.57.6",
    "wandb==0.25.0",
]

[tool.setuptools.package-data]
"lmms_eval.tasks.m3eval" = ["*.yaml", "_generation_kwargs_yaml"]

[tool.setuptools.packages.find]
include = ["lmms_eval*"]

[project.scripts]
lmms-eval = "lmms_eval.__main__:cli_evaluate"

[project.urls]
Homepage = "https://pku-value-lab.github.io/m3eval-homepage/"
Repository = "https://github.com/PKU-VaLuE-Lab/m3eval"
