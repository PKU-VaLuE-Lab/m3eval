[project]
name = "m3eval-internvl"
version = "0.2.0"
description = "Pinned InternVL3.5-8B environment for the M3Eval paper reproduction"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.12.0",
    "av==15.1.0",
    "datasets==4.5.0",
    "decord==0.6.0",
    "einops==0.8.2",
    "evaluate==0.4.6",
    "httpx==0.28.1",
    "huggingface-hub==0.36.2",
    "Jinja2==3.1.6",
    "jsonlines==4.0.0",
    "loguru==0.7.3",
    "matplotlib==3.10.8",
    "numpy==2.2.6",
    "packaging==26.0",
    "pandas==2.3.3",
    "pillow==12.1.1",
    "protobuf==6.33.5",
    "pydantic==2.13.0b2",
    "pytablewriter==1.2.1",
    "pytz==2025.2",
    "PyYAML==6.0.3",
    "qwen-vl-utils==0.0.14",
    "requests==2.32.5",
    "sacrebleu==2.6.0",
    "safetensors==0.7.0",
    "scikit-learn==1.7.2",
    "sentencepiece==0.2.1",
    "tenacity==9.1.4",
    "timm==1.0.24",
    "tokenizers==0.22.2",
    "torch==2.10.0+cu129",
    "torchvision==0.25.0+cu129",
    "tqdm==4.67.3",
    "transformers==4.57.6",
    "wandb==0.25.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[dependency-groups]
dev = ["pre-commit==4.5.1", "black==25.1.0", "isort==6.0.1"]
