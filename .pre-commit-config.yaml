repos:
  - repo: local
    hooks:
      - id: black
        name: black (locked uv environment)
        entry: uv run --locked --no-sync black --line-length=240
        language: system
        types: [python]
      - id: isort
        name: isort (locked uv environment)
        entry: uv run --locked --no-sync isort --profile black
        language: system
        types: [python]
